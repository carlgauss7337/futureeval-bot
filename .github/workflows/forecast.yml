name: Forecast on open tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 minutes, off the hour

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false # let a running job finish; at most one more queues behind it

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }} # the job idles until that secret is set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # the CLI's npm package needs Node 22 or later
      - name: Install Claude Code CLI
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.304 # version the flags in bot.py were tested on
      - name: Run bot on FutureEval (fall 2026) and MiniBench
        if: env.HAS_CLAUDE == 'true'
        run: python bot.py 33121 minibench --limit 6
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORECAST_FINAL_MODEL: fable # prizes go to the top few bots; if this model is refused the bot falls back to the research median
