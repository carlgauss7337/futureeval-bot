name: Forecast on open tournament questions

on:
  workflow_dispatch:
    inputs:
      selfcheck:
        description: Also check that both Claude models answer here (two small calls)
        type: boolean
        default: false
  schedule:
    # GitHub starts only a few of these a day (see the README); each one restarts the chain of the `next` job below
    - cron: "7,27,47 * * * *"

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false # one run at a time, the 20-minute wait included; at most one more queues behind it

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }} # the job idles until that secret is set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # the CLI's npm package needs Node 22 or later
      - name: Install Claude Code CLI
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.304 # version the flags in bot.py were tested on
      - name: Check that both Claude models answer (manual runs with selfcheck ticked)
        if: env.HAS_CLAUDE == 'true' && github.event.inputs.selfcheck == 'true'
        run: bash run.sh --selfcheck
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Run bot on this season's tournaments
        if: env.HAS_CLAUDE == 'true'
        run: bash run.sh # a failed listing or question exits non-zero, so the run shows red
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  next:
    # Every run starts the next one, because GitHub's scheduler alone is far too sparse (see the README).
    # The environment's 20-minute wait timer holds this job first; no runner is used while it waits.
    needs: forecast
    if: ${{ !cancelled() }} # also after a failed forecast; cancelling the waiting run stops the chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: every-20-minutes
    permissions:
      actions: write # to start this workflow again
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Start the next run
        run: bash next.sh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
